[global_config]
  suppress_multiple_term_dialog = True
[keybindings]
[profiles]
  [[default]]
    cursor_color = "#aaaaaa"
    exit_action = hold
    scrollback_infinite = True
[layouts]
  [[three]]
    [[[window0]]]
      type = Window
      parent = ""
      position = 960:0
      size = 960, 1040
      title = G-SHOCK 진행 상황
    [[[split_main]]]
      type = HPaned
      parent = window0
      position = 480
    [[[terminal_stack]]]
      type = Terminal
      parent = split_main
      order = 0
      profile = default
      title = 통신 스택
      command = bash -lc 'cd /home/phorce/Downloads/main && ./check_robot_communication.sh; printf "\n종료됨. 위 오류를 확인하세요.\n"; exec bash'
    [[[split_right]]]
      type = VPaned
      parent = split_main
      order = 1
      position = 520
    [[[terminal_torque]]]
      type = Terminal
      parent = split_right
      order = 0
      profile = default
      title = 실시간 토크/외란
      command = bash -lc 'cd /home/phorce/Downloads/main && ./torque_console.py; exec bash'
    [[[terminal_status]]]
      type = Terminal
      parent = split_right
      order = 1
      profile = default
      title = 상태 및 오류
      command = bash -lc 'cd /home/phorce/Downloads/main && ./status_console.sh; exec bash'
[plugins]
